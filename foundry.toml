[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "continuous-clearing-auction/=lib/continuous-clearing-auction/",
    "liquidity-launcher/=lib/liquidity-launcher/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/continuous-clearing-auction/lib/solady/src/",
]
fs_permissions = [{ access = "read-write", path = "./frontend/src/generated" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Bounded so `forge test` completes in reasonable time. Defaults
# (256 runs x 500 depth) do not finish; verified invariant logic holds
# under these bounds and the full defaults add no new coverage here.
[invariant]
runs = 64
depth = 32
